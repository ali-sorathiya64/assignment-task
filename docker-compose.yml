services:
   backend:
    build: ./backend
    container_name: task_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"


   client:
    build: ./frontend
    container_name: task_client
    restart: always
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend